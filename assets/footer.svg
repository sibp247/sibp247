    <text x="450" y="72" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" letter-spacing="3">SIBP247 · DHAKA, BANGLADESH</text>
