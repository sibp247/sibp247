    <path d="M0,70 Q225,45 450,72 T900,64 L900,115 L0,115 Z" fill="url(#waveGrad1)"/>
    <path d="M0,84 Q240,104 480,82 T900,88 L900,115 L0,115 Z" fill="url(#waveGrad2)"/>

