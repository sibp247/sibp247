<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 115" width="900" height="115">
  <defs>
    <clipPath id="footerClip">
      <rect width="900" height="115" rx="20"/>
    </clipPath>
    <linearGradient id="footerTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
