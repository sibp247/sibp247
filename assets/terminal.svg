<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" width="900" height="245">
  <style>
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
  </style>
  <defs>
    <clipPath id="termClip">
      <rect width="900" height="245" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#termClip)">
    <rect width="900" height="245" fill="#0b0f1a"/>

    <!-- Top bar -->
    <rect width="900" height="36" fill="#111827"/>
    <line x1="0" y1="36" x2="900" y2="36" stroke="#1e293b" stroke-width="1"/>
    <circle cx="24" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="44" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="64" cy="18" r="5.5" fill="#27c93f"/>
    <text x="450" y="22" text-anchor="middle" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">sibp247 — ~/about</text>

    <!-- Terminal lines -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5">
      <text x="32" y="70"><tspan fill="#22d3ee">❯</tspan> <tspan fill="#a78bfa">whoami</tspan></text>
      <text x="48" y="92" fill="#e2e8f0">Shahidul Islam — Full Stack Developer based in Bangladesh (UTC+6)</text>

      <text x="32" y="124"><tspan fill="#22d3ee">❯</tspan> <tspan fill="#a78bfa">cat</tspan> <tspan fill="#94a3b8">~/focus.txt</tspan></text>
      <text x="48" y="146" fill="#e2e8f0">Web Apps · PWAs · Developer Tools · AOSP Kernels (sm6225)</text>

      <text x="32" y="178"><tspan fill="#22d3ee">❯</tspan> <tspan fill="#a78bfa">echo</tspan> <tspan fill="#f472b6">$PORTFOLIO</tspan></text>
      <text x="48" y="200" fill="#22d3ee">https://sibp247.vercel.app</text>

      <text x="32" y="226" fill="#22d3ee">❯</text>
      <rect class="cursor" x="48" y="213" width="8.5" height="15" rx="1.5" fill="#22d3ee"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="244" rx="16" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
