<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <defs>
    <clipPath id="cardClip">
      <rect width="900" height="240" rx="20"/>
    </clipPath>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="240" fill="#0b0f1a"/>

    <!-- Aurora orbs -->
    <circle cx="150" cy="70" r="190" fill="url(#glowPurple)"/>
    <circle cx="460" cy="30" r="160" fill="url(#glowPink)"/>
    <circle cx="760" cy="175" r="190" fill="url(#glowCyan)"/>

    <!-- Subtle stars -->
    <g fill="#e2e8f0" opacity="0.35">
      <circle cx="95" cy="48" r="1.2"/>
      <circle cx="230" cy="145" r="1"/>
      <circle cx="310" cy="40" r="1.3"/>
      <circle cx="590" cy="52" r="1.1"/>
      <circle cx="670" cy="120" r="1.4"/>
      <circle cx="810" cy="55" r="1.2"/>
      <circle cx="135" cy="170" r="1"/>
      <circle cx="730" cy="90" r="1"/>
    </g>

    <!-- Bottom waves -->
    <path d="M0,192 Q225,165 450,190 T900,185 L900,240 L0,240 Z" fill="#11192e" opacity="0.7"/>
    <path d="M0,208 Q260,185 520,206 T900,200 L900,240 L0,240 Z" fill="#16203a" opacity="0.8"/>

    <!-- Typography (non-overlapping) -->
    <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="7">HELLO, I'M</text>

    <text x="450" y="128" text-anchor="middle" fill="url(#nameGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">Shahidul Islam</text>

    <text x="450" y="162" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="4.5">FULL STACK DEVELOPER</text>

    <text x="450" y="206" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="4">BANGLADESH · UTC+6</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="239" rx="20" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
