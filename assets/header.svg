    <g fill="#e2e8f0" opacity="0.35">
      <circle cx="80" cy="42" r="1.2"/>
      <circle cx="200" cy="135" r="1"/>
      <circle cx="270" cy="36" r="1.3"/>
      <circle cx="510" cy="48" r="1.1"/>
      <circle cx="585" cy="110" r="1.4"/>
      <circle cx="690" cy="50" r="1.2"/>
    </g>

    <path d="M0,176 Q190,152 380,174 T760,170 L760,220 L0,220 Z" fill="#11192e" opacity="0.7"/>
    <path d="M0,192 Q220,170 440,190 T760,186 L760,220 L0,220 Z" fill="#16203a" opacity="0.8"/>

    <text x="380" y="64" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="6">HELLO, I'M</text>
    <text x="380" y="118" text-anchor="middle" fill="url(#nameGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800">Shahidul Islam</text>
    <text x="380" y="152" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="4">FULL STACK DEVELOPER</text>
    <text x="380" y="192" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="3.5">BANGLADESH · UTC+6</text>
